name: Setup Pulumi
description: Install the pinned Pulumi CLI and isolated infra/ dependencies

runs:
  using: composite
  steps:
    - name: Install Pulumi CLI 3.255.0
      shell: bash
      run: |
        # Pin 3.255.0: CLI >= 3.256.0 fails writing DIY state to Cloudflare R2 (InvalidDigest).
        # Do not bump without checking https://github.com/pulumi/pulumi/issues/24219
        curl -fsSL https://get.pulumi.com | sh -s -- --version 3.255.0
        echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

    - name: Install infra dependencies
      shell: bash
      working-directory: infra
      run: npm ci --workspaces=false
