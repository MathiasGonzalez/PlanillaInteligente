name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate project
        run: npm run test:local

      - name: Validate required deploy secrets (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME_PROD: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_PROD }}
          CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_PROD: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_PROD }}
        run: |
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME_PROD CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_PROD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply planilla-inteligente --remote --config apps/web-workspace/wrangler.jsonc

      - name: Deploy enrichment consumer Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config workers/api-enrichment-consumer/wrangler.jsonc

      - name: Deploy workspace to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_PROD }}
        run: |
          npx wrangler pages deploy ./apps/web-workspace/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main

      - name: Deploy landing to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_PROD }}
        run: |
          npx wrangler pages deploy ./apps/web-landing/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main

  deploy-dev:
    if: github.ref_name == 'dev' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate project
        run: npm run test:local

      - name: Validate required deploy secrets (development)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME_DEV: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_DEV }}
          CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_DEV: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_DEV }}
        run: |
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME_DEV CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_DEV; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Apply D1 migrations (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply planilla-inteligente-preview --remote --config apps/web-workspace/wrangler.jsonc

      - name: Deploy enrichment consumer Worker (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config workers/api-enrichment-consumer/wrangler.jsonc --env preview

      - name: Deploy workspace to Cloudflare Pages (development)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_DEV }}
        run: |
          npx wrangler pages deploy ./apps/web-workspace/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch dev

      - name: Deploy landing to Cloudflare Pages (development)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME_LANDING_DEV }}
        run: |
          npx wrangler pages deploy ./apps/web-landing/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch dev
